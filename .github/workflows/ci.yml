name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest
      - name: Validate skills and catalogue
        run: python tools/build_catalogue.py --check
      - name: Reference tests of the calculation scripts
        run: pytest -q tests
